{% if page.toc %}
<nav class="toc" aria-label="On this page" hidden>
  <p class="toc-label">On this page</p>
  <ol class="toc-list"></ol>
</nav>

<details class="toc-mobile" hidden>
  <summary>On this page</summary>
  <ol class="toc-list"></ol>
</details>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var body = document.querySelector('.post-body');
  var side = document.querySelector('.toc');
  var drawer = document.querySelector('.toc-mobile');
  if (!body || !side || !drawer) return;

  var heads = Array.prototype.slice.call(body.querySelectorAll('h2, h3'));
  if (heads.length < 3) return;

  var lists = document.querySelectorAll('.toc-list');
  var links = [];

  heads.forEach(function (h) {
    if (!h.id) {
      h.id = h.textContent.trim().toLowerCase()
        .replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
    }
    Array.prototype.forEach.call(lists, function (list) {
      var li = document.createElement('li');
      li.className = 'toc-' + h.tagName.toLowerCase();
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      li.appendChild(a);
      list.appendChild(li);
      links.push(a);
    });
  });

  side.hidden = false;
  drawer.hidden = false;

  // Mark the section currently in view.
  if ('IntersectionObserver' in window) {
    var visible = {};
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { visible[e.target.id] = e.isIntersecting; });
      var current = null;
      heads.forEach(function (h) { if (!current && visible[h.id]) current = h.id; });
      if (!current) return;
      links.forEach(function (a) {
        a.classList.toggle('is-current', a.getAttribute('href') === '#' + current);
      });
    }, { rootMargin: '-10% 0px -70% 0px' });
    heads.forEach(function (h) { obs.observe(h); });
  }

  // Collapse the drawer once a reader jumps somewhere.
  Array.prototype.forEach.call(drawer.querySelectorAll('a'), function (a) {
    a.addEventListener('click', function () { drawer.open = false; });
  });
});
</script>
{% endif %}
